<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS — Wear Your Campus | Official Merchandise Store</title>
  <meta name="description" content="NEXUS — Shop official campus merchandise — t-shirts, hoodies, jackets, caps, bags and more. Made to represent your community.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="siteHeader"></header>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h1>WEAR YOUR COLLEGE.</h1>
          <p>Discover merchandise made to represent your college community. Premium quality, campus-ready style.</p>
          <div class="hero-btns">
            <a href="products.html" class="btn btn-accent">Shop Merchandise</a>
            <a href="products.html#categories" class="btn btn-outline" style="border-color:#fff;color:#fff;">Explore Collection</a>
          </div>
        </div>
        <div class="hero-img">
          <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80" alt="College merchandise collection">
        </div>
      </div>
    </section>

    <!-- CATEGORIES -->
    <section class="section container" id="categories">
      <div class="section-head">
        <h2>Shop by Category</h2>
        <p>Find exactly what represents you</p>
      </div>
      <div class="category-grid" id="categoryGrid"></div>
    </section>

    <!-- FEATURED -->
    <section class="section container" style="padding-top:0;">
      <div class="section-head">
        <h2>Featured Merchandise</h2>
        <p>Handpicked favourites from the collection</p>
      </div>
      <div class="product-grid" id="featuredGrid"></div>
      <div style="text-align:center;margin-top:36px;">
        <a href="products.html" class="btn btn-primary">View All Products</a>
      </div>
    </section>
  </main>

  <footer id="siteFooter"></footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/products.js"></script>
</body>
</html>
