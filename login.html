<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CollegeMerch</title>
  <meta name="description" content="Log in to your CollegeMerch account.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="siteHeader"></header>
  <main>
    <section class="auth-wrap">
      <h1>Welcome Back</h1>
      <p class="sub">Log in to continue shopping</p>
      <div class="demo-hint">Demo user — Email: <strong>aarav@college.com</strong> · Password: <strong>student123</strong></div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="liEmail">Email</label>
          <input type="email" id="liEmail" autocomplete="email"><span class="error-msg" id="liEmailErr"></span>
        </div>
        <div class="form-group">
          <label for="liPass">Password</label>
          <input type="password" id="liPass" autocomplete="current-password"><span class="error-msg" id="liPassErr"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
      </form>
      <p class="form-note"><a href="forgot-password.html">Forgot Password?</a></p>
      <p class="form-note">Don't have an account? <a href="signup.html">Signup</a></p>
    </section>
  </main>
  <footer id="siteFooter"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
