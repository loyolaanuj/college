<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CollegeMerch</title>
  <meta name="description" content="Reset your CollegeMerch password.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="siteHeader"></header>
  <main>
    <section class="auth-wrap">
      <h1>Forgot Password</h1>
      <p class="sub">Enter your email to receive a demo reset link</p>
      <div id="fpSuccess" class="demo-hint" style="display:none;background:#dcfce7;border-color:#86efac;color:#166534;"></div>
      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="fpEmail">Email</label>
          <input type="email" id="fpEmail"><span class="error-msg" id="fpEmailErr"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>
      <p class="form-note">Remembered it? <a href="login.html">Login</a></p>
    </section>
  </main>
  <footer id="siteFooter"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
