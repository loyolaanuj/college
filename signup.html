<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — NEXUS</title>
  <meta name="description" content="Create your NEXUS campus store account.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header id="siteHeader"></header>
  <main>
    <section class="auth-wrap">
      <h1>Create Account</h1>
      <p class="sub">Join the college community</p>
      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="suName">Full Name</label>
          <input type="text" id="suName"><span class="error-msg" id="suNameErr"></span>
        </div>
        <div class="form-group">
          <label for="suEmail">Email</label>
          <input type="email" id="suEmail"><span class="error-msg" id="suEmailErr"></span>
        </div>
        <div class="form-group">
          <label for="suPhone">Phone (optional)</label>
          <input type="tel" id="suPhone">
        </div>
        <div class="form-group">
          <label for="suPass">Password</label>
          <input type="password" id="suPass"><span class="error-msg" id="suPassErr"></span>
        </div>
        <div class="form-group">
          <label for="suConfirm">Confirm Password</label>
          <input type="password" id="suConfirm"><span class="error-msg" id="suConfirmErr"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="signupBtn">Sign Up</button>
      </form>
      <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
    </section>
  </main>
  <footer id="siteFooter"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
